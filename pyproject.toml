[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-telegram-business-assistant"
version = "0.1.0"
description = "Domain foundation for a controlled, tenant-aware Telegram business assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Northstar Auto Care demo team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/business_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=business_assistant --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["business_assistant"]
mypy_path = "src"
