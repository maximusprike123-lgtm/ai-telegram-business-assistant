name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Scan tracked files for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Strict mypy
        run: mypy

      - name: Unit and architecture tests with coverage
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build --no-isolation
