[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-telegram-business-assistant"
version = "0.2.0rc1"
description = "Controlled, tenant-aware Telegram business assistant with validated workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Northstar Auto Care demo team" }]
dependencies = [
  "aiogram>=3.28,<4",
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.22,<1",
  "SQLAlchemy[asyncio]>=2.0.45,<2.1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "detect-secrets>=1.5,<2",
  "editables>=0.3,<1",
  "hatchling>=1.27,<2",
  "httpx2>=2.7,<3",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
business-assistant-telegram-polling = "business_assistant.bootstrap.telegram_polling:main"
business-assistant-expire-holds = "business_assistant.bootstrap.expire_holds:main"
business-assistant-worker = "business_assistant.bootstrap.worker:main"
business-assistant-beat = "business_assistant.bootstrap.worker:beat_main"

[tool.hatch.build.targets.wheel]
packages = ["src/business_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=business_assistant --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "postgresql: requires a real PostgreSQL database with pgvector",
]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["business_assistant"]
mypy_path = "src"
